[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "citizen-db"
dynamic = ["version"]
description = "Interactive mock db for managing users."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Sampsa Penna" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Environment :: Console",
    "Topic :: Database :: Front-Ends",
]

[project.optional-dependencies]
test = [
    "black==26.10.1",
]

[project.scripts]
manage-citizen-db = "citizen_db.cli:main"

[project.urls]
Source = "https://github.com/sampsapenna/programming-basics-lecture-examples"
Documentation = "https://github.com/sampsapenna/programming-basics-lecture-examples"

[tool.hatch.version]
path = "citizen_db/__init__.py"

[tool.black]
line-length = 90
target-version = ['py312']
